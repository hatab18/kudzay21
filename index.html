<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Приглашение на день рождения</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: 'Georgia', serif;
    background: linear-gradient(135deg, #f8e8ee 0%, #f4d5e0 50%, #e8c5d5 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #4a2c3a;
  }
  
  .card {
    background: #fffafc;
    max-width: 600px;
    width: 100%;
    border-radius: 24px;
    padding: 50px 40px;
    box-shadow: 0 20px 60px rgba(122, 50, 80, 0.15);
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  
  .card::before {
    content: "🎂";
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 60px;
    opacity: 0.15;
  }
  
  .subtitle {
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #b56b8a;
    margin-bottom: 15px;
  }
  
  h1 {
    font-size: 42px;
    font-weight: normal;
    color: #8b3a5c;
    margin-bottom: 10px;
    line-height: 1.2;
  }
  
  .name {
    font-style: italic;
    color: #b56b8a;
    font-size: 22px;
    margin-bottom: 30px;
  }
  
  .divider {
    width: 60px;
    height: 2px;
    background: #d99ab2;
    margin: 30px auto;
  }
  
  .info {
    text-align: left;
    margin: 30px 0;
  }
  
  .info-item {
    display: flex;
    align-items: flex-start;
    margin-bottom: 18px;
    font-size: 17px;
    line-height: 1.5;
  }
  
  .info-item .icon {
    font-size: 22px;
    margin-right: 15px;
    flex-shrink: 0;
  }
  
  .info-item .label {
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #b56b8a;
    display: block;
    margin-bottom: 3px;
  }
  
  .message {
    font-size: 17px;
    line-height: 1.7;
    color: #6b4255;
    margin: 30px 0;
    font-style: italic;
    padding: 0 10px;
  }
  
  .button {
    display: inline-block;
    background: #8b3a5c;
    color: #fff;
    text-decoration: none;
    padding: 16px 40px;
    border-radius: 50px;
    font-size: 17px;
    letter-spacing: 1px;
    transition: all 0.3s;
    margin-top: 15px;
  }
  
  .button:hover {
    background: #6d2b47;
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(139, 58, 92, 0.3);
  }
  
  .button.secondary {
    background: transparent;
    color: #8b3a5c;
    border: 2px solid #d99ab2;
    margin-left: 10px;
  }
  
  .button.secondary:hover {
    background: #f8e8ee;
  }
  
  @media (max-width: 480px) {
    .card { padding: 35px 25px; }
    h1 { font-size: 32px; }
    .button { padding: 14px 28px; font-size: 15px; display: block; margin: 10px 0; }
    .button.secondary { margin-left: 0; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="subtitle">Приглашение</div>
  <h1>День рождения</h1>
  <div class="name">[Ваше имя]</div>
  
  <div class="divider"></div>
  
  <div class="info">
    <div class="info-item">
      <span class="icon">📅</span>
      <div>
        <span class="label">Когда</span>
        [Дата] в [Время]
      </div>
    </div>
    <div class="info-item">
      <span class="icon">📍</span>
      <div>
        <span class="label">Где</span>
        [Место: кафе, ресторан, адрес]
      </div>
    </div>
  </div>
  
  <div class="message">
    Дорогой друг!<br><br>
    Буду очень рад(а) видеть тебя на моём празднике. 
    Приходи с хорошим настроением — будет тепло, вкусно и весело!<br><br>
    Пожалуйста, подтверди своё присутствие.
  </div>
  
  <a href="https://wa.me/79990000000?text=Привет!%20Я%20приду%20на%20твой%20день%20рождения!" 
     class="button">Я приду 🎉</a>
</div>

</body>
</html>
